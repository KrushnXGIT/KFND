<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
    <style>
        div{
            width: 20vw;
            height: 20vh;
            background-color: aqua;
            position: relative;
            animation: abcd 5s infinite;
            animation-delay: 1s;
        }

        @keyframes abcd {
            0%{
                left:0;
                top: 0;
                
            }
            25%{
                top: 0;
                left: 500px;
            }
            50%{
                top: 500px;
                left: 500px;
            }
            75%{
                top:500px;
                left:0;
            }
            100%{
                 top: 0;
                 left: 0;   
            }
        }

    </style>
    
</head>
<body>
    <div id="boxtoCircle">
        
    </div>
</body>
</html>
