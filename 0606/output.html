<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body onresize="fun()">
    <h1 oncopy="fun2(event)">copy</h1>
    <h1 oncut="fun2(event)">cut</h1>
    <h1 ondrag="fun2(event)">drag</h1>
    <h1 onpaste="fun2(event)">paste</h1>
    <h1 ondrop="fun2(event)">drop</h1>

    <h1 draggable="true">skfnsdk </h1>

    <script>
      function fun(event){
        event.preventDefault();
        alert("Logout")
      }
      function fun2(){
        alert("Copied")
      }
    </script>
</body>

</html>
