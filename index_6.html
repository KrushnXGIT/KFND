<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #main{
            display: grid;
            /* border: 2px solid black; */
            background-color: rgb(37, 37, 112);
            padding: 10%;
            height:400px;
            grid-template-columns: repeat(4,1fr);
            width: 40%;
            
        }
        #b1{
            grid-row:1/4;
            grid-column: 1/2;
            background-color: green;
        }
        #b2{
            grid-row:1/2;
            grid-column: 2/4;
            background-color: green;
        }
        #b3,#b4,#b7{
            background-color: red;
        }
        #b5,#b6{
            background-color: yellow;
        }
        #b8{
            grid-row:2/4;
            grid-column: 4/5;
            background-color: green;
        }
        #main div{
            /* border: 2px solid red; */
            
            margin:2px;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="b1"></div>
        <div id="b2"></div>
        <div id="b3"></div>
        <div id="b4"></div>
        <div id="b5"></div>
        <div id="b6"></div>
        <div id="b7"></div>
        <div id="b8"></div>
    </div>
</body>
</html>
